name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  find:
    name: Find apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.addons_list }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Still named find-addons upstream; it returns the app directories.
      - name: 🔍 Find app directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@master

  lint-app:
    name: Lint app ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.find.outputs.apps) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🚀 Run Home Assistant App Lint
        uses: frenck/action-addon-linter@f995494fd84fae6310d23617e66d0e37de4f14eb # v2.21.0
        with:
          path: "./${{ matrix.path }}"

  lint-hadolint:
    name: Hadolint ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJson(needs.find.outputs.apps) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🚀 Run Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: "./${{ matrix.path }}/Dockerfile"

  lint-shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🚀 Run Shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          # bashio and s6 helpers are not resolvable at lint time.
          SHELLCHECK_OPTS: -e SC1091

  lint-yamllint:
    name: YAMLLint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🚀 Run YAMLLint
        uses: frenck/action-yamllint@34b4bbcaeabedcfefad6adea8c5bbc42af0e2d47 # v1.5.0

  lint-config-keys:
    name: App config keys intact
    runs-on: ubuntu-latest
    needs: find
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Developing locally means commenting keys out of config.yaml — "image"
      # so Supervisor builds from the working tree instead of pulling. It is
      # easy to comment out a neighbouring line by accident, and the result is
      # a silent behaviour change rather than an error: a missing "init: false"
      # simply reverts to the schema default of true, and s6-overlay then dies
      # with "can only run as pid 1". This catches both before they ship.
      - name: 🔍 Check config keys are present and uncommented
        env:
          APPS: ${{ needs.find.outputs.apps }}
        run: |
          # Keys whose absence changes runtime behaviour silently.
          watched='name|version|slug|arch|init|image|ingress|ports|schema|options|map'
          failed=0

          for app in $(jq -r '.[]' <<< "${APPS}"); do
            config="${app}/config.yaml"

            if ! grep -qE '^image:[[:space:]]*\S' "${config}"; then
              echo "::error file=${config}::Missing 'image:'. Uncomment it before merging;"
              echo "  without it Supervisor rebuilds the app on every user's machine."
              failed=1
            fi

            while IFS= read -r hit; do
              echo "::error file=${config},line=${hit%%:*}::Commented-out config key: ${hit#*:}"
              failed=1
            done < <(grep -nE "^#[[:space:]]*(${watched}):" "${config}" || true)
          done

          if [[ ${failed} -ne 0 ]]; then
            exit 1
          fi

          echo "All app config keys present and uncommented."
